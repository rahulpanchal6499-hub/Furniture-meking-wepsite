:root{

/* Welcome Animation */
.welcome{
background:#17231f;
color:#fff;
overflow:hidden;
padding:12px 0;
white-space:nowrap;
border-bottom:2px solid #d6ad68;
}

.welcome span{
display:inline-block;
padding-left:100%;
font-size:17px;
font-weight:bold;
color:#f5d28b;
animation:welcomeMove 18s linear infinite;
}

@keyframes welcomeMove{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

header{
background:var(--dark);

}

}
